<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    body{
        text-align: center;
        font-family: Arial, Helvetica, sans-serif;
        background-color: #f4f4f4;
        margin: 50px;
    }
    container{
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 40px;
    }
    img{
        width: 200px;
        border-radius: 5px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        transition: transform 0.5s ease-in-out ;
    }

    .zoom:hover{
        transform: scale(1.2);
    }

    .zoom-animate{
animation: zoomeffect 3s infinite alternate ease-in-out;    
}
@keyframes zoomeffect { 0%{transform:scale(1)}
100%{ transform: scale(1.3);}
}

.stretch:hover{
    transform: scaleX(1.5);
}

.tall:hover{
    transform: scaley(1.5);
}
.shrink:hover{
    transform: scale(0.7);
}
    </style>
</head>
<body>
    
        <h1>Image effects </h1>
        <div class="container">
            <div> <h2>1.hower to zoom</h2>
                <img src="harley-davidson.png" alt="zoom image" class="zoom">
            </div>
        </div>
        <div><h2>2.continuos zoom in and out</h2>
            <img src="harley-davidson.png" alt="zoom animation" class="zoom-animate">
        </div>
        <div>
            <h2>3.hover to strtch horizontally</h2>
            <img src="harley-davidson.png" alt="stretch image" class="stretch">
        </div>
        <div>
            <h2>4.hover to stretch vertically </h2>
            <img src="harley-davidson.png" alt="tall image" class="tall">
        </div>
        <div><h2>5.hover to shrink</h2>
        <img src="harley-davidson.png" alt="shrink image" class="shrink">
    </div>
 
</body>
</html>
